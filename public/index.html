<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pop Cat ทีมเดียวกัน</title>
<style>
:root{--bg:#fff7ed;--card:#fff;--tx:#2b2118;--mu:#7a6a5c;--bd:#ecd9c6;--ac:#f4722b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1712;--card:#2a231b;--tx:#f5ece2;--mu:#b5a594;--bd:#43382b}}
:root[data-theme="dark"]{--bg:#1c1712;--card:#2a231b;--tx:#f5ece2;--mu:#b5a594;--bd:#43382b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Sarabun","Noto Sans Thai",sans-serif;line-height:1.4}
#app{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 4px;text-align:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
button,input{font:inherit;color:inherit}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);margin:4px 0}
button{padding:12px 16px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:700;cursor:pointer;width:100%;margin:4px 0}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.on{outline:3px solid var(--ac)}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.row button{width:auto;flex:1}
.mu{color:var(--mu);font-size:14px;text-align:center}
.code{font-size:44px;font-weight:800;letter-spacing:8px;text-align:center}
.team{border-left:8px solid var(--c);cursor:pointer}
.team.me{outline:3px solid var(--c)}
.chip{display:inline-block;background:var(--bd);border-radius:20px;padding:2px 10px;margin:2px;font-size:13px}
.bar{height:14px;border-radius:8px;background:var(--c);transition:width .3s;min-width:4px}
#cat{position:relative;width:min(70vw,280px);margin:8px auto;border-radius:24px;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
#cat img{display:block;width:100%;pointer-events:none}
#cat img.o{position:absolute;inset:0;opacity:0}
#cat.open img.o{opacity:1}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:30vmin;font-weight:800;background:rgba(0,0,0,.6);color:#fff;z-index:9}
.big{font-size:22px;font-weight:800}
#board{position:relative}
.tr{position:absolute;left:0;right:0;top:0;height:72px;margin:0;overflow:hidden;transition:transform .5s ease}
#toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#2b2118;color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:20;text-align:center}
</style></head><body>
<div id="app"></div><div id="toast"></div>

function say(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>t.style.display='none',3000)}

<div class="card"><b>เข้าร่วมห้อง</b><input id="cin" maxlength="4" placeholder="รหัสห้อง 4 ตัว" style="text-transform:uppercase;text-align:center;font-size:22px;letter-spacing:6px"><button data-a="join">เข้าห้อง</button></div><p class="mu" id="err">${db?'':'ต้องเปิดผ่านลิงก์ที่แชร์ให้ (ต้องล็อกอิน) จึงจะใช้ระบบออนไลน์ได้'}</p>`,
setup:()=>`<h1>สร้างห้อง</h1><div class="card"><div class="row"><button class="g" data-a="n" data-v="-1">−</button><span class="big" id="nn"></span><button class="g" data-a="n" data-v="1">+</button></div><p class="mu">จำนวนทีม (2–6)</p><div id="ti"></div></div><button data-a="create">สร้างห้อง</button><button class="g" data-a="home">ยกเลิก</button>`,
lobby:()=>`<h1>ห้อง</h1><div class="code" id="rc"></div><p class="mu">ให้เพื่อนใส่รหัสนี้เพื่อเข้าร่วม</p><input id="nm" placeholder="ชื่อของคุณ" maxlength="16"><div id="dyn"></div>`,
game:()=>`<div class="row"><span class="big" id="tm"></span><span class="big" id="ms"></span></div><div id="board"></div><div id="cw">${CAT}<p class="mu">แตะแมวรัวๆ!</p></div><div id="ov"></div>`,
end:()=>`<h1>🏁 จบเกม!</h1><div id="dyn"></div><button class="g" data-a="home">กลับหน้าหลัก</button>`};
const RH=80;
function updBoard(){const b=$('#board'),T=teams();if(+b.dataset.n!==T.length){b.dataset.n=T.length;b.style.height=T.length*RH+'px';b.innerHTML=T.map((nm,i)=>`<div class="card tr" style="--c:${COL[i]};transform:translateY(${i*RH}px)"><div class="row"><b><span class="rk"></span> ${esc(nm)}</b><span class="big sc"></span></div><div class="bar"></div></div>`).join('')}
const t=T.map((_,i)=>tot(i)),mx=Math.max(1,...t),o=t.map((_,i)=>i).sort((a,c)=>t[c]-t[a]||a-c);
o.forEach((i,r)=>{const el=b.children[i];el.style.transform=`translateY(${r*RH}px)`;el.querySelector('.rk').textContent=MED[r]||(r+1)+'.';el.querySelector('.sc').textContent=t[i];el.querySelector('.bar').style.width=(t[i]/mx*100)+'%'})}
const F={
setup:()=>{$('#nn').textContent=n+' ทีม';$('#ti').innerHTML=Array.from({length:n},(_,i)=>`<input data-i="${i}" value="${esc(tn[i]||'ทีม '+(i+1))}" maxlength="14" style="border-left:8px solid ${COL[i]}">`).join('')},
lobby:()=>{const host=room.hostId===id,mp=me();$('#rc').textContent=code;$('#nm').style.display=host?'none':'';
let h=teams().map((nm,i)=>{const m=players.filter(p=>p.team===i);return`<div class="card team${mp&&mp.team===i?' me':''}" style="--c:${COL[i]}" ${host?'':`data-a="team" data-v="${i}"`}><div class="row"><b>${esc(nm)}</b><span class="mu">${m.length} คน</span></div>${m.map(p=>`<span class="chip">${esc(p.name)}</span>`).join('')}</div>`}).join('');
if(host)h+=`<div class="card"><b>เวลาเล่น</b><div class="row">${[1,3,5,10].map(d=>`<button class="g${d===dur?' on':''}" data-a="dur" data-v="${d}">${d} นาที</button>`).join('')}</div><button data-a="start" ${players.length?'':'disabled'}>▶ เริ่มเกม (${players.length} คน)</button></div><button class="g" data-a="cancel" ${cfm?'style="background:#d62839;color:#fff"':''}>${cfm?'แตะอีกครั้งเพื่อยืนยัน: ยกเลิกห้อง':'✖ ยกเลิกห้อง'}</button>`;
else h+=`<p class="mu">${mp?'เลือกทีมแล้ว รอ Host กดเริ่ม…':'ใส่ชื่อ แล้วแตะทีมที่ต้องการ'}</p><button class="g" data-a="cancel">ออกจากห้อง</button>`;
$('#dyn').innerHTML=h},
game:()=>{updBoard();$('#cw').style.display=me()?'':'none';$('#ms').textContent=me()?'⭐ '+score:'';updT()},
end:()=>{const r=teams().map((nm,i)=>({nm,i,t:tot(i)})).sort((a,b)=>b.t-a.t);
const all=players.slice().sort((a,b)=>(b.score||0)-(a.score||0));
$('#dyn').innerHTML=r.map((x,k)=>{const m=players.filter(p=>p.team===x.i).sort((a,b)=>(b.score||0)-(a.score||0));return`<div class="card team" style="--c:${COL[x.i]}" data-a="open" data-v="${x.i}"><div class="row"><b>${MED[k]||k+1+'.'} ${esc(x.nm)}</b><span class="big">${x.t}</span></div>${openT===x.i?m.map((p,j)=>`<div class="row"><span>${j?'':'👑 '}${esc(p.name)}</span><b>${p.score||0}</b></div>`).join('')||'<p class="mu">ไม่มีผู้เล่น</p>':''}</div>`}).join('')+'<p class="mu">แตะที่ทีมเพื่อดูผู้เล่น</p>'+(all[0]?`<p class="mu">MVP: ${esc(all[0].name)} (${all[0].score||0})</p>`:'')}};
function updT(){if(view!=='game'||!room)return;const p=phase(),t=now(),ov=$('#ov');
if(p==='cd'){ov.style.display='flex';ov.textContent=Math.ceil((room.startAt-t)/1000)}else ov.style.display='none';
$('#tm').textContent='⏱ '+fmt(p==='cd'?room.endAt-room.startAt:room.endAt-t)}
function render(){if(code&&!room)return;const p=phase(),v=!code?screen:p==='lobby'?'lobby':p==='end'?'end':'game';if(v!==view){view=v;app.innerHTML=L[v]()}F[v]&&F[v]()}
function send(o){o.pid=id;if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function flush(){if(!dirty)return;dirty=0;send({t:'score',s:score})}
function hit(){if(phase()!=='play'||!me())return;score++;dirty=1;pop();$('#ms').textContent='⭐ '+score;if(!ft)ft=setTimeout(()=>{ft=0;flush()},350)}
function leave(m){const w=ws;ws=null;code='';room=null;players=[];score=0;screen='home';view='';try{localStorage.removeItem('pc_code')}catch(e){}w&&w.close();render();const e=$('#err');if(e&&m)e.textContent=m}
function connect(c,first){code=c;lastP='';openT=-1;try{localStorage.setItem('pc_code',c)}catch(e){}
const w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/'+c);ws=w;
w.onopen=()=>send(first);
w.onmessage=e=>{const m=JSON.parse(e.data);
if(m.t==='state'){if(m.status==='gone'){leave('Host ยกเลิกห้องแล้ว');return}off=m.now-Date.now();room=m;players=m.players;const mm=me();if(room.status==='lobby')score=0;else if(mm&&mm.score>score)score=mm.score;render()}
else if(m.t==='err'){if(m.m==='exists'&&first.t==='create'){w.onclose=null;w.close();connect(newCode(),first)}else leave(m.m==='exists'?'':m.m)}};
w.onclose=()=>{if(ws===w&&code)setTimeout(()=>{if(ws===w&&code)connect(code,{t:'join'})},1200)}}
app.onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
try{
if(a==='setup')screen='setup',view='',render();
else if(a==='home')leave();
else if(a==='cancel'){const host=room.hostId===id;if(host&&!cfm){cfm=1;render();setTimeout(()=>{cfm=0;code&&render()},4000);return}cfm=0;
if(host)send({t:'destroy'});else send({t:'leave'});
leave()}
else if(a==='n'){n=Math.min(6,Math.max(2,n+ +v));render()}
else if(a==='create')connect(newCode(),{t:'create',teams:tn.slice(0,n)});
else if(a==='join'){const c=$('#cin').value.trim().toUpperCase();if(c.length===4)connect(c,{t:'join'})}
else if(a==='team'){const nm=$('#nm').value.trim();if(!nm)return say('กรุณาใส่ชื่อก่อน');send({t:'player',name:nm,team:+v})}
else if(a==='dur'){dur=+v;render()}
else if(a==='start')send({t:'start',dur});
else if(a==='again')send({t:'reset'});
else if(a==='open'){openT=openT===+v?-1:+v;render()}
}catch(err){say('เกิดข้อผิดพลาด: '+(err.message||err.code))}};
app.oninput=e=>{const i=e.target.dataset.i;if(i!=null)tn[+i]=e.target.value};
app.onpointerdown=e=>{if(e.target.closest('#cat')){$('#cat').classList.add('open');hit()}};
addEventListener('pointerup',()=>{const c=$('#cat');c&&c.classList.remove('open')});
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&view==='game'){e.preventDefault();$('#cat').classList.add('open');hit()}});
addEventListener('keyup',e=>{if(e.code==='Space'){const c=$('#cat');c&&c.classList.remove('open')}});
setInterval(()=>{if(!code||!room)return;const p=phase();if(p!==lastP){lastP=p;if(p==='end'){dirty=1;flush()}render()}updT()},200);
render();
render();
let sc='';try{sc=localStorage.getItem('pc_code')||''}catch(e){}
if(sc)connect(sc,{t:'join'});
</script></body></html>
